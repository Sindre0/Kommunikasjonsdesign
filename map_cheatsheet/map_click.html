<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Map with Scrollable Locations</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        /* Layout styles */
        #container {
            display: flex;
        }

        #mapContainer {
            width: 60%;
            height: 600px;
        }

        #locations {
            width: 40%;
            height: 600px;
            overflow-y: scroll;
            padding: 10px;
            background-color: #f0f0f0;
        }

        .location-item {
            margin-bottom: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="container">
        <!-- Map container -->
        <section id="mapContainer"></section>

        <!-- Scrollable locations -->
        <aside id="locations">
            <div class="location-item" data-lat="59.1291" data-lng="11.35314" data-zoom="12">Location 1: Starting Point
            </div>
            <div class="location-item" data-lat="59.911491" data-lng="10.757933" data-zoom="13">Location 2: Oslo</div>
            <div class="location-item" data-lat="60.391263" data-lng="5.322054" data-zoom="10">Location 3: Bergen</div>
            <div class="location-item" data-lat="63.430515" data-lng="10.395053" data-zoom="15">Location 4: Trondheim
            </div>
            <!-- Add more locations as needed -->
        </aside>
    </div>

    <script>
        // Initialize the map
        const mapMain = L.map('mapContainer', {
            center: [59.1291, 11.35314],
            zoom: 5
        });

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '<a href="https://openstreetmap.org/copyright">Open Street Map</a>'
        }).addTo(mapMain);

        // Create a marker variable that can be updated
        let marker = L.marker([59.1291, 11.35314]).addTo(mapMain);

        // Function to update map based on data attributes
        function updateMap(lat, lng, zoom) {
            mapMain.flyTo([lat, lng], zoom || 10, {
                animate: true,
                duration: 2 // Duration of the animation in seconds
            });
            marker.setLatLng([lat, lng]); // Move marker
        }

        // Add event listeners to location items
        document.querySelectorAll('.location-item').forEach(item => {
            item.addEventListener('click', () => {
                const lat = item.getAttribute('data-lat');
                const lng = item.getAttribute('data-lng');
                const zoom = item.getAttribute('data-zoom'); // Get zoom level

                updateMap(lat, lng, zoom);
            });
        });
    </script>

</body>

</html>
